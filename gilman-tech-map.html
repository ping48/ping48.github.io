    #unknown-panel {

      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);

    #unknown-toggle {

      cursor: pointer;
      font-weight: 600;
      color: #1a1a1a;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #unknown-list {
      padding: 0 14px 10px;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    #unknown-list.open {
      display: block;
    }
    .unknown-item {
      padding: 4px 0;
      color: #555;
      border-bottom: 1px solid #eee;
      font-size: 0.78rem;
    }
    .unknown-item:last-child {
      border-bottom: none;
    }
    .popup-photo {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 50%;
      float: left;
      margin: 0 10px 6px 0;
    }
    .popup-inner::after {
      content: '';
      display: table;
      clear: both;
    }
    .popup-inner h3 {
      margin: 0 0 4px;
      font-size: 0.95rem;
      color: #1a1a1a;

    .popup-work {

      color: #333;
      margin: 0 0 4px;
    }
    .popup-abroad {
      font-size: 0.78rem;
      color: #666;
      margin: 0 0 8px;
    }
    .popup-btn {
      display: inline-block;
      margin-right: 6px;
      margin-top: 2px;
      padding: 4px 10px;
      font-size: 0.75rem;
      border: none;
      border-radius: 4px;
      background: #0a66c2;
      color: #fff;
      cursor: pointer;
    }
    .popup-btn-ig {

    function openLink(b64) {
      if (!b64) return;
      try { window.open(atob(b64), '_blank', 'noopener,noreferrer'); }
      catch(e) { console.warn('Invalid link encoding'); }
    }

    function buildPopup(p) {
      let html = `<div class="popup-inner">
        ${p.photo ? `<img class="popup-photo" src="${p.photo}" alt="${p.name}">` : ''}
        <h3>${p.name}</h3>
        <p class="popup-location">${p.location}</p>
        <p class="popup-work">${p.workSummary}</p>
        <p class="popup-abroad"><em>Study abroad: ${p.studyAbroad}</em></p>`;
      if (p.li) {
        html += `<button class="popup-btn" onclick="openLink('${p.li}')">LinkedIn</button>`;
      }
      if (p.ig) {
        html += `<button class="popup-btn popup-btn-ig" onclick="openLink('${p.ig}')">Instagram</button>`;
      }
      html += `</div>`;
      return html;
    }

    function togglePanel() {
      const list = document.getElementById('unknown-list');
      const arrow = document.getElementById('unknown-arrow');
      list.classList.toggle('open');
      arrow.textContent = list.classList.contains('open') ? '▼' : '▶';
    }

    const map = L.map('map').setView([38.5, -96.0], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const unknown = participants.filter(p => !p.location);
    const listEl = document.getElementById('unknown-list');
    document.getElementById('unknown-label').textContent = `Location unknown (${unknown.length})`;
    unknown.forEach(p => {
      const item = document.createElement('div');
      item.className = 'unknown-item';
      item.textContent = p.name;
      listEl.appendChild(item);
    });

    function loadMarkers() {
      const known = participants.filter(p => p.location);
      const statusEl = document.getElementById('loading-status');
      const cityCount = {};
      let placed = 0;

      for (const p of known) {
        const coords = locationCoords[p.location];
        if (!coords) continue;

        const n = cityCount[p.location] || 0;
        cityCount[p.location] = n + 1;
        const lat = coords.lat + n * 0.018;
        const lng = coords.lng + n * 0.018;

        L.marker([lat, lng]).addTo(map).bindPopup(buildPopup(p), { maxWidth: 300 });
        placed++;
      }

      statusEl.textContent = `${placed} mapped · ${unknown.length} location unknown`;
    }

    loadMarkers();
